name: protolib
purpose: Critical design decisions and rationale. Append-only. Do not reverse without prior investigation.
edit: update_docs.sh
update: 'Use ~/utils/update_docs.sh to manage entries. add: docs p a {"doc":"p","op":"add","title":"...","status":"open","decision":"..."}  modify: docs p c {"doc":"p","op":"modify","datetime":"YYYY-MM-DDTHH:MM:SS","field":"value"}  remove: docs p r {"doc":"p","op":"remove","datetime":"YYYY-MM-DDTHH:MM:SS"}'
schema:
  fields:
    datetime:
      type: string
      format: YYYY-MM-DDTHH:MM:SS
      allowed:
        - ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$
    title:
      type: string
      hint: domain or component name
    status:
      type: string
      allowed:
        - open
        - deprecated
    decision:
      type: string
      hint: 'design decision and rationale; append  | ref: ~/path  if a doc exists'
  collection: decisions
view:
  col_widths:
    title: 28
    decision: 70
decisions:
  - datetime: 2026-03-30T16:43:51
    decision: 'Protolib is a clone template. Shared modules (helpers/, contracts.py) must not contain logic or dependencies specific to one clone: env-specific vars, third-party imports not universally available, or hardcoded business logic. Lazy-import or guard with try/except ImportError if a dep is not universal across all clones.'
    status: open
    title: 'Template isolation: logic must stay generic across all clones'
  - datetime: 2026-03-30T16:43:55
    decision: Design decisions baked into the template (API contract, registry integration, server structure, clone mechanism) must not be changed in clones without understanding downstream impact. The template is the source of truth for shared architecture. Clones extend it — they do not refactor it.
    status: open
    title: Template boilerplate decisions are binding on clones
  - datetime: 2026-03-30T16:44:00
    decision: __main__.py discards runable(...).main(...) return value — never pass to sys.exit(), causes double output and exit code 1. Every apis/*.py main() must both print() output (CLI) and return the string (HTTP). Server _run_api() captures return value and discards stdout.
    status: open
    title: 'API output contract: print + return in apis, discard in __main__'
  - datetime: 2026-03-30T16:44:04
    decision: check_env_vars is a no-op in the template — clones add their own env loading. get_package_data resolves paths from settings.py attributes (project_dir, package_dir, project_name, package_name). DirContext tree traversal removed — produced wrong results in clones with non-standard layouts.
    status: open
    title: 'contracts.py stubs: check_env_vars and get_package_data are clone overrides'
  - datetime: 2026-03-30T16:44:09
    decision: registry.py and server.py are template boilerplate — extend them in clones, do not replace with custom implementations. Keeps all packages interoperable. Registry connector uses only stdlib (urllib.request, threading, json, pathlib). No fcntl, no requests, no flask. RegistryHost uses threading.Lock at class level — keep it that way.
    status: open
    title: 'Registry and server: extend template APIs, do not reimplement'
  - datetime: 2026-03-30T16:44:13
    decision: RegistryClient, RegistryHost, ApiIntrospector live in registry.py — separate from protopy.py (DefaultClass). API wrappers (expose_api, register, announce) use relative imports (from ..registry), making them clone-proof with no text replacement needed on the import line.
    status: open
    title: Registry classes in dedicated registry.py, not protopy.py
  - datetime: 2026-03-30T16:44:17
    decision: 'All package and environment management uses uv (uv sync, uv run, uv add). Do not use pip directly. Applies to protolib and all clones. | ref: ~/.claude/rules/'
    status: open
    title: 'Python environment: uv only'
  - datetime: 2026-03-30T16:44:21
    decision: 'All Python code must follow standard developer best practices. The *args/**kwargs threading convention is documented in ~/.claude/rules/kwargs.md — read before writing or modifying any function signatures. | ref: ~/.claude/rules/kwargs.md'
    status: open
    title: 'Python best practices: follow kwargs.md conventions'
