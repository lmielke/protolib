# script_path: src/protolib/test/core/gov/logs/governance_log.yaml
# purpose: "Per-file governance scan log. Only files with warnings or errors are recorded."
# update_rules: "Regenerated by test_governance.py on every run. Do not edit by hand."
#
# Schema (per file entry):
#   header:                # mirror of the file's module-docstring front-matter
#     script_path: ...
#     purpose: ...
#     description: ...
#     update_rules: ...
#     governance_exceptions: [...]   # if declared
#   last_checked: <iso8601> # validation date
#   warnings: [<record>]    # non-empty
#   errors:   [<record>]    # non-empty
#
# Record shape (every warning/error):
#   - name:   "<code> - <label>"             # reused from governance.py (## cN: name)
#     rule:   "@rules/<file>.md"             # reused from governance.py (## cN: rule)
#     helper: src/.../gov/helpers/cN.py      # derivable from name's code; explicit for corrector ergonomics
#     line: <int>                            # runtime — violation position
#     scope: module|class|def                # runtime — where it applies
#     technical_message: "<formatted>"       # template from governance.py (## cN: tech
#                                            # OR tech_templates[<kind>]); runner formats
#                                            # with helper-emitted params before writing.
#     display_message: "<formatted>"         # template from governance.py (## cN: purpose);
#                                            # runner formats with rule params before writing.
#
# Reuse contract: ALL prose in a record originates in governance.py. Helpers emit only
# (kind, runtime_params) tuples; the runner picks the template and formats it. Records
# carry no string the helper invented inline. Threshold numbers (max line count, max def
# length, etc.) are config — never literals: templates use {placeholder}s; the runner
# merges runtime_params (helper) with config_params (core/settings.py per-rule namespace)
# before calling .format().
#
# `level:` is intentionally absent — implicit from parent list (`warnings:` vs `errors:`).
#
# Files passing every check are NOT recorded — absence == clean.

last_checked: '2026-04-27T16:30:00'

