# script_path: src/protolib/test/core/gov/settings.yml
# purpose: gov-only engine config — scan filters and log header banner.
# update_rules: Per-rule thresholds live inline in governance.py cN_params blocks.
#               Only engine-wide config (scan, log_header) belongs here.

# log header — front-matter banner prepended to governance_log.yaml on save
log_header: |
  # script_path: src/protolib/test/core/gov/logs/governance_log.yaml
  # purpose: "Per-file governance scan log. Only files with warnings or errors are recorded."
  # update_rules: "Regenerated by governance.py on every run. Do not edit by hand."
  #

# scan filters — discover_sources walks SRC_ROOT under these
scan:
  skip_dirs:  [test, resources, __pycache__]
  skip_files: [__init__.py, __main__.py, auto_correct.py]
